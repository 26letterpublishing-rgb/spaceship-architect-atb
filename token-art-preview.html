<!doctype html><html lang="en"><meta charset="utf-8"><title>Token Artwork QA</title>
<link rel="stylesheet" href="crew-tokens.css"><link rel="stylesheet" href="token-art.css"><script src="token-art.js"></script>
<style>body{margin:20px;background:#0a1725;color:#e5f5ff;font:15px Arial}h1{font-size:24px}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}article{border:1px solid #395767;padding:12px;min-width:0}h2{font-size:15px;text-transform:capitalize;margin:0 0 12px}.variants{display:flex;justify-content:space-around;gap:12px}.sample{display:flex;gap:14px;align-items:center}.sample>span{display:block;width:32px;height:32px;--token-color:#55efae}.large .sample>span{width:64px;height:64px}.large main{grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:700px){main,.large main{grid-template-columns:repeat(2,minmax(0,1fr))}}.legend{margin:8px 0;color:#acbbc9;font-size:12px}.ship img{width:100%;height:130px;object-fit:contain;filter:drop-shadow(1px 0 #f76be4) drop-shadow(-1px 0 #f76be4) drop-shadow(0 1px #f76be4) drop-shadow(0 -1px #f76be4)}button{padding:9px;margin:0 8px 14px 0}input{vertical-align:middle}</style>
<h1>Character and Ship Token Inspection</h1><p>32px tokens; standing / animated stride, both race variants. The walking cycle is 0.84 seconds.</p>
<button id="size">Toggle 32 / 64 pixels</button><button id="motion">Pause / Resume walking</button><label>ATB outline <input id="color" type="color" value="#55efae"></label><main id="races"></main><h1>Eight ship designs</h1><main id="ships"></main>
<script>
const art=SATokenArt;document.querySelector('#races').innerHTML=art.races.map(r=>`<article><h2>${r.replaceAll('-',' ')}</h2><div class="variants">${art.options(r).map(o=>`<section><div class="sample"><span>${art.figure(r,o.value)}</span><span class="crew-walking">${art.figure(r,o.value)}</span></div><p class="legend">${o.label}: idle / walk</p></section>`).join('')}</div></article>`).join('');
document.querySelector('#ships').innerHTML=art.ships.map((s,i)=>`<article class="ship"><h2>${s}</h2><img src="${art.shipImage({mapIcon:i+1})}" alt="${s}"></article>`).join('');
document.querySelector('#size').onclick=()=>document.body.classList.toggle('large');document.querySelector('#motion').onclick=()=>document.querySelectorAll('.sample>span:nth-child(2)').forEach(e=>e.classList.toggle('crew-walking'));
document.querySelector('#color').oninput=e=>document.querySelectorAll('.sample>span').forEach(n=>n.style.setProperty('--token-color',e.target.value));
</script></html>
