services:
  - type: web
    name: spaceship-architect-atb-sync
    runtime: node
    plan: free
    buildCommand: npm install && npm run release:stage && npm run release:verify-stage
    startCommand: npm start
    envVars:
      - key: SA_APP_MODE
        value: shared
      - key: SA_RELEASE_PUBLIC_DIR
        value: .release-public
      - key: NODE_VERSION
        value: 24
